name: CI Docker Build & Push

on:
  push:
    branches:
      - lab-trivy

jobs:
  docker:
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: ci-html-demo
      IMAGE_TAG: latest
      DOCKER_REGISTRY: rosita17

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Test Varibales
        run: |
          echo "Varibale MYVAR  ${{ vars.MYVAR }} "
          echo "Varibale IMAGE_NAME $IMAGE_NAME"
          echo "Varibale DOCKER_REGISTRY  $DOCKER_REGISTRY "

      - name: Connexion à Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build de l'image Docker
        run: |
          docker build -t $DOCKER_REGISTRY/$IMAGE_NAME:$IMAGE_TAG .

      - name: Test de l'image Docker
        run: |
          docker image ls $DOCKER_REGISTRY/$IMAGE_NAME:$IMAGE_TAG

      - name: Push de l'image Docker
        run: |
          docker push $DOCKER_REGISTRY/$IMAGE_NAME:$IMAGE_TAG

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: rosita17/ci-html-demo:latest
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1
          vuln-type: os,library
          ignore-unfixed: true
deploy:
    runs-on: self-hosted
    needs: docker

    steps:
      - name: Pull de l'image Docker
        run: |
          docker pull ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Stopper le conteneur existant
        run: |
          docker stop ${{ env.IMAGE_NAME }} || true

      - name: Supprimer l'ancien conteneur
        run: |
          docker rm ${{ env.IMAGE_NAME }} || true

      - name: Lancer le nouveau conteneur
        run: |
          docker run -d \
            --name ${{ env.IMAGE_NAME }} \
            -p 80:80 \
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}